name: CI - Pruebas de Integración

on: [push, pull_request]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v2

    - name: Set up Java 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Build y ejecutar pruebas
      run: mvn clean verify -f registraduria/pom.xml

    - name: Publicar reporte JaCoCo
      uses: actions/upload-artifact@v4
      with:
        name: jacoco-report
        path: registraduria/target/site/jacoco/
